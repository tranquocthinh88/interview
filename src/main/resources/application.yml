spring:
  application:
    name: bank
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show_sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/bankdb
    username: postgres
    password: 123456
  security:
    user:
      name: trungthinh
      password: 080602
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 giờ
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "*"   # Mở tất cả endpoint Actuator
  endpoint:
    health:
      show-details: always   # Hiển thị chi tiết thông tin health check
  metrics:
    tags:
      application: BankApplication